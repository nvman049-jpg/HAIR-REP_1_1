<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hệ Thống Salon - HAIR REP 1-1</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../../assets/css/style.css">
</head>
<body>

    <div id="header-placeholder"></div>

    <main style="padding: 100px 0; text-align: center;">
        <div class="container">
            <h1>HỆ THỐNG SALON CHÍNH HÃNG</h1>
            <p>Đang cập nhật danh sách địa chỉ...</p>
        </div>
    </main>
    
    <div id="footer-placeholder"></div>

    <script>
        // Hàm nhúng file HTML
        function loadComponent(id, file) {
            fetch(file)
                .then(response => {
                    if (!response.ok) throw new Error("Không tìm thấy file: " + file);
                    return response.text();
                })
                .then(data => {
                    document.getElementById(id).innerHTML = data;
                })
                .catch(err => console.error("Lỗi nhúng file: ", err));
        }

        loadComponent('header-placeholder', '../../assets/components/header.html');
        loadComponent('footer-placeholder', '../../assets/components/footer.html');

        // Logic Modal (nếu có)
        function moModal() { 
            var modal = document.getElementById("modalOverlay");
            if(modal) modal.style.display = "flex"; 
        }
        function dongModal() { 
            var modal = document.getElementById("modalOverlay");
            if(modal) modal.style.display = "none"; 
        }
    </script>

    <script src="../../assets/js/script.js"></script>
</body>
</html>
